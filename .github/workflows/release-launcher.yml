name: Build launcher release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build versioned application payload
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "${version}" = "${package_version}"
          bash scripts/package-installer-payload.sh .
      - uses: actions/upload-artifact@v6
        with:
          name: application-payload
          path: |
            client-interaction-crm-app-v*.zip
            client-interaction-crm-app-v*.zip.sha256
          if-no-files-found: error

  launcher:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            output: client-interaction-crm-setup-linux-amd64
          - os: windows-latest
            goos: windows
            output: ClientInteractionCRM-Setup-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: installer/go.mod
      - name: Test launcher
        working-directory: installer
        run: go test ./...
      - name: Build launcher
        shell: bash
        working-directory: installer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "${{ matrix.output }}" .
      - name: Generate checksum (Linux)
        if: runner.os == 'Linux'
        working-directory: installer
        run: sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"
      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: installer
        run: |
          $file = "${{ matrix.output }}"
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content -Encoding ascii "$file.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-${{ matrix.goos }}-amd64
          path: |
            installer/${{ matrix.output }}
            installer/${{ matrix.output }}.sha256
          if-no-files-found: error

  windows-uninstaller:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: installer/go.mod
      - name: Test uninstaller
        working-directory: installer
        run: go test ./uninstaller
      - name: Build standalone Windows uninstaller
        shell: bash
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o "Uninstall Client Interaction CRM.exe" ./uninstaller
      - name: Generate checksum
        shell: pwsh
        working-directory: installer
        run: |
          $file = "Uninstall Client Interaction CRM.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content -Encoding ascii "$file.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-uninstaller
          path: |
            installer/Uninstall Client Interaction CRM.exe
            installer/Uninstall Client Interaction CRM.exe.sha256
            Run-Windows-Setup.cmd
          if-no-files-found: error
